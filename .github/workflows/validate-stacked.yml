name: Validate stacked explorer (temporary)

on:
  push:
    branches: [agent/split-canvas-explorer]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test
          tests/e2e/seeded-fmcg.spec.ts
          tests/e2e/sector-presets.spec.ts
          tests/e2e/network-disabled.spec.ts
