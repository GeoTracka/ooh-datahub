name: Apply UI65 map label

on:
  push:
    branches:
      - agent/ui-quality-unhappy-paths

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-unhappy-paths
          fetch-depth: 0
      - name: Label embedded upload map
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/UploadDialog.tsx')
          text = path.read_text()
          old = '<MapCanvas scene={uploadScenes.local} />'
          new = '<MapCanvas scene={uploadScenes.local} ariaLabel="Uploaded inventory map" />'
          if old not in text:
              raise SystemExit('expected upload map call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/UploadDialog.tsx
          git commit -m "fix: distinguish uploaded inventory map landmark"
          git push origin HEAD:agent/ui-quality-unhappy-paths
      - name: Remove temporary helper
        run: |
          git rm .github/workflows/apply-ui65-map-label.yml
          git commit -m "chore: remove UI65 map label helper"
          git push origin HEAD:agent/ui-quality-unhappy-paths
