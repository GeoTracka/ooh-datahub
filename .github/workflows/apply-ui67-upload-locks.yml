name: Apply UI67 upload review locks

on:
  push:
    branches:
      - agent/ui-quality-transition-states

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-transition-states
          fetch-depth: 0
      - name: Lock prior review mutations during provider work
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/features/UploadDialog.tsx")
          text = p.read_text()
          changes = [
            (
              '''              <button\n                key={candidate.candidateToken}\n                type="button"\n                aria-pressed={item.selectedCandidateToken === candidate.candidateToken}\n''',
              '''              <button\n                key={candidate.candidateToken}\n                type="button"\n                disabled={busy}\n                aria-pressed={item.selectedCandidateToken === candidate.candidateToken}\n''',
            ),
            (
              '''                <input\n                  inputMode="decimal"\n                  value={corrections[item.row.rowId]?.latitude ?? ""}\n''',
              '''                <input\n                  inputMode="decimal"\n                  disabled={busy}\n                  value={corrections[item.row.rowId]?.latitude ?? ""}\n''',
            ),
            (
              '''                <input\n                  inputMode="decimal"\n                  value={corrections[item.row.rowId]?.longitude ?? ""}\n''',
              '''                <input\n                  inputMode="decimal"\n                  disabled={busy}\n                  value={corrections[item.row.rowId]?.longitude ?? ""}\n''',
            ),
            (
              '''            <button type="button" onClick={() => applyCorrection(item.row.rowId)}>\n              Use customer coordinate\n            </button>\n''',
              '''            <button type="button" disabled={busy} onClick={() => applyCorrection(item.row.rowId)}>\n              Use customer coordinate\n            </button>\n''',
            ),
            (
              '''          <button className="primary" type="button" onClick={() => onDraft(\n            applyUploadToDraft(snapshot, [...selected]),\n            snapshot,\n          )}>\n''',
              '''          <button className="primary" type="button" disabled={busy} onClick={() => onDraft(\n            applyUploadToDraft(snapshot, [...selected]),\n            snapshot,\n          )}>\n''',
            ),
            (
              '''            onFeatureSelect={(featureId) => setSnapshot((current) => {\n''',
              '''            onFeatureSelect={busy ? undefined : (featureId) => setSnapshot((current) => {\n''',
            ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"missing upload lock block: {old[:100]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/UploadDialog.tsx
          git commit -m "fix: lock upload review state during provider work"
          git rm .github/workflows/apply-ui67-upload-locks.yml
          git commit -m "chore: remove UI67 upload lock helper"
          git push origin HEAD:agent/ui-quality-transition-states
