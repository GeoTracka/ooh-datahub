name: Apply audience-lens review from PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-audience-lens-review-pr
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/survey-audience-lens-review-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/survey-audience-lens-review-20260822
          fetch-depth: 0
      - id: state
        name: Check whether tranche is already applied
        run: |
          if grep -q 'SurveyAudienceLensChoice' src/survey/lagosPlanningContext.ts; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Extract and verify staged patch
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          awk '/^H4sI/{capture=1} /^PAYLOAD$/{capture=0} capture{print}' .github/workflows/apply-audience-lens-review.yml > /tmp/audience-lens-review.patch.gz.b64
          base64 -d /tmp/audience-lens-review.patch.gz.b64 | gzip -d > /tmp/audience-lens-review.patch
          echo '4a12dd7eca087b70c9d3535718d6e761d757ba58950b6426052401a709199787  /tmp/audience-lens-review.patch' | sha256sum --check
          patch -p1 --dry-run < /tmp/audience-lens-review.patch
      - name: Apply atomic tranche
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          patch -p1 < /tmp/audience-lens-review.patch
          git rm .github/workflows/apply-audience-lens-review.yml .github/workflows/apply-audience-lens-review-pr.yml .github/workflows/export-audience-lens-review-worktree.yml
          git add -A
      - name: Commit and push
        if: steps.state.outputs.applied != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add user-reviewable survey audience lens'
          git push origin HEAD:agent/survey-audience-lens-review-20260822
