name: Approve inspected UI59 focused baseline

on:
  push:
    branches: [agent/ui-quality-hierarchy]

permissions:
  contents: write
  actions: read

jobs:
  approve-focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-hierarchy
      - name: Download inspected CI failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/GeoTracka/ooh-datahub/actions/artifacts/9088991994/zip > /tmp/ui59-focused.zip
          mkdir -p /tmp/ui59-focused
          unzip -q /tmp/ui59-focused.zip -d /tmp/ui59-focused
      - name: Approve only inspected focused baseline and remove helper
        run: |
          cp /tmp/ui59-focused/test-results/visual-accessibility-locks-f3541-rchy-and-interaction-states-chromium/explorer-step3-focused-actual.png \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step3-focused-chromium-linux.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step3-focused-chromium-linux.png
          git rm .github/workflows/approve-ui59-focused.yml
          git commit -m "test: approve inspected focused Step 3 baseline"
          git push origin HEAD:agent/ui-quality-hierarchy
