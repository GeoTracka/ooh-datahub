name: E2B2 component terminology sync

on:
  push:
    branches: [agent/grid3-settlement-morphology-e2b2]
    paths:
      - .github/workflows/e2b2-component-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/grid3-settlement-morphology-e2b2
      - name: Align acceptance test and docs with connected-component morphology
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('scripts/test-grid3-settlement-integration.ts')
          text = test.read_text()
          text = text.replace(
              "round(settled_area_share::numeric,3)::text || ':' || intersecting_settlement_count::text || ':' ||\n  coalesce(primary_degree_urbanisation,'-'),",
              "round(settled_area_share::numeric,3)::text || ':' || intersecting_source_extent_count::text || ':' ||\n  settled_component_count::text || ':' || coalesce(primary_degree_urbanisation,'-'),",
          )
          text = text.replace(
              'const corePatches = await scalar("SELECT intersecting_settlement_count FROM ooh_data.site_settlement_context WHERE site_id=\'site:morph-core\' AND radius_m=500;");',
              'const coreComponents = await scalar("SELECT settled_component_count FROM ooh_data.site_settlement_context WHERE site_id=\'site:morph-core\' AND radius_m=500;");',
          )
          text = text.replace(
              'const fragmentedPatches = await scalar("SELECT intersecting_settlement_count FROM ooh_data.site_settlement_context WHERE site_id=\'site:morph-fragmented\' AND radius_m=500;");',
              'const fragmentedComponents = await scalar("SELECT settled_component_count FROM ooh_data.site_settlement_context WHERE site_id=\'site:morph-fragmented\' AND radius_m=500;");',
          )
          text = text.replace(
              'if (!(coreDepth > fragmentedDepth && coreShare > fragmentedShare && fragmentedPatches > corePatches)) {',
              'if (!(coreDepth > fragmentedDepth && coreShare > fragmentedShare && fragmentedComponents > coreComponents)) {',
          )
          if 'intersecting_settlement_count' in text:
              raise SystemExit('stale intersecting_settlement_count remains in acceptance fixture')
          test.write_text(text)

          docs = Path('docs/grid3-settlement-morphology.md')
          doc = docs.read_text()
          doc = doc.replace(
              '- positive-area intersecting settlement count;\n- patch density per km²;\n- largest settlement-intersection area;\n- largest-patch share of settled area.',
              '- positive-area intersecting **source extent** count (provenance/overlap diagnostic);\n- connected settlement-component count after union;\n- connected-component density per km²;\n- largest connected-component area/share.',
          )
          doc = doc.replace(
              'core depth, settled-area share and patch count',
              'core depth, settled-area share and connected-component count',
          )
          docs.write_text(doc)
          PY
      - name: Commit synchronized terminology
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-grid3-settlement-integration.ts docs/grid3-settlement-morphology.md
          git diff --cached --quiet && exit 0
          git commit -m 'test: align E2B2 connected-component semantics'
          git push origin HEAD:agent/grid3-settlement-morphology-e2b2
