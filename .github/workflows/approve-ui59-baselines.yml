name: Approve reviewed UI59 baselines

on:
  push:
    branches: [agent/ui-quality-hierarchy]

permissions:
  contents: write
  actions: read

jobs:
  approve-reviewed-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-hierarchy
      - name: Download inspected CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/GeoTracka/ooh-datahub/actions/artifacts/9088326902/zip > /tmp/ui59.zip
          mkdir -p /tmp/ui59
          unzip -q /tmp/ui59.zip -d /tmp/ui59
      - name: Approve only the two inspected baselines
        run: |
          cp /tmp/ui59/test-results/visual-accessibility-locks-f3541-rchy-and-interaction-states-chromium/explorer-step1-actual.png \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step1-chromium-linux.png
          cp /tmp/ui59/test-results/visual-accessibility-keeps-76a11-r-legible-at-390-CSS-pixels-chromium/explorer-mobile-390-actual.png \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-mobile-390-chromium-linux.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step1-chromium-linux.png \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-mobile-390-chromium-linux.png
          git diff --cached --quiet && exit 0
          git commit -m "test: approve reviewed step1 and mobile baselines"
          git push origin HEAD:agent/ui-quality-hierarchy
