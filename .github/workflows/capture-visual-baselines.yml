name: Capture visual baselines

# One-shot branch-only capture. The workflow is removed after the artifact is reviewed.
on:
  push:
    branches:
      - agent/ci-baseline-repair-20260822

permissions:
  contents: write

concurrency:
  group: visual-baseline-capture-agent-ci-baseline-repair-20260822
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ui): capture reviewed visual baselines') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-baseline-repair-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/visual-accessibility.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-visual-baselines-${{ github.run_id }}
          path: tests/e2e/visual-accessibility.spec.ts-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-accessibility.spec.ts-snapshots/*.png
          git commit -m "chore(ui): capture reviewed visual baselines"
          git push origin HEAD:agent/ci-baseline-repair-20260822
