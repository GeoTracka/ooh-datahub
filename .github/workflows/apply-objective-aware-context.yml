name: Apply objective-aware survey context

on:
  push:
    branches:
      - agent/survey-objective-aware-context-20260822
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-objective-aware-survey-context
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/survey-objective-aware-context-20260822' || github.ref_name == 'agent/survey-objective-aware-context-20260822' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/survey-objective-aware-context-20260822
          fetch-depth: 0
      - id: state
        name: Check whether planner wiring is already applied
        run: |
          if grep -q 'selectLagosPlanningContextArtifact' src/features/PlannerPage.tsx; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply deterministic planner wiring
        if: steps.state.outputs.applied != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/PlannerPage.tsx")
          content = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'import { lagosPlanningContextArtifact } from "@/survey/lagosPlanningContext";',
                  'import { selectLagosPlanningContextArtifact } from "@/survey/lagosPlanningContext";',
                  1,
              ),
              (
                  "  const visible = selectVisiblePlan(state);\n  const dirty = selectIsDirty(state);",
                  "  const visible = selectVisiblePlan(state);\n  const planningContextArtifact = selectLagosPlanningContextArtifact(\n    visible?.brief.objective ?? \"broad_reach\",\n  );\n  const dirty = selectIsDirty(state);",
                  1,
              ),
              (
                  "artifact={lagosPlanningContextArtifact}",
                  "artifact={planningContextArtifact}",
                  2,
              ),
          ]
          for old, new, expected in replacements:
              actual = content.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"PLANNER_WIRING_BASIS_MISMATCH: expected {expected}, found {actual}: {old}"
                  )
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY
          git add src/features/PlannerPage.tsx
          git rm -r .github/patches .github/workflows/apply-objective-aware-context.yml
      - name: Commit and push
        if: steps.state.outputs.applied != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: select survey context by campaign objective"
          git push origin HEAD:agent/survey-objective-aware-context-20260822
