name: Cleanup stacked validation workflows

on:
  push:
    branches: [agent/split-canvas-explorer]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-canvas-explorer
      - name: Remove temporary validation workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/validate-stacked.yml .github/workflows/cleanup-stacked-validation.yml
          git commit -m "ci: remove temporary stacked validation workflows"
          git push origin HEAD:agent/split-canvas-explorer
