name: Update deterministic map baselines

on:
  push:
    branches: [agent/ux-map-interaction]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-map-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/visual-accessibility.spec.ts --update-snapshots
      - name: Commit deterministic baselines and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-accessibility.spec.ts-snapshots
          git rm .github/workflows/update-map-reduced-motion-baselines.yml
          git commit -m "test: lock reduced-motion map baselines"
          git push origin HEAD:agent/ux-map-interaction
