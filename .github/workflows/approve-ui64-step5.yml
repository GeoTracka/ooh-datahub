name: Approve inspected UI64 Step5 baseline

on:
  push:
    branches:
      - agent/ui-quality-finetune-workspace

permissions:
  contents: write

jobs:
  approve-step5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-finetune-workspace
      - name: Download inspected CI failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9093067031/zip > /tmp/ui64-failure.zip
          mkdir -p /tmp/ui64
          unzip -q /tmp/ui64-failure.zip -d /tmp/ui64
      - name: Approve only inspected Step 5 baseline and remove helper
        run: |
          cp /tmp/ui64/test-results/visual-accessibility-locks-f3541-rchy-and-interaction-states-chromium/explorer-step5-dirty-actual.png \
            tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step5-dirty-chromium-linux.png
          rm .github/workflows/approve-ui64-step5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step5-dirty-chromium-linux.png .github/workflows/approve-ui64-step5.yml
          git commit -m "test: approve inspected Step 5 dirty baseline"
          git push origin HEAD:agent/ui-quality-finetune-workspace
