name: Apply objective-aware survey context

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-objective-aware-survey-context
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/objective-aware-survey-context-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/objective-aware-survey-context-20260822
          fetch-depth: 0
      - name: Reconstruct and verify patch
        run: |
          cat .github/objective-context-patch/part-* > /tmp/objective-context.patch
          echo '1f21b9a600769c4dda448e3ea0351510afd3f67e84966ff2ecd5bc8ed576fe46  /tmp/objective-context.patch' | sha256sum --check
          git apply --check /tmp/objective-context.patch
      - name: Apply atomic tranche
        run: |
          git apply --index /tmp/objective-context.patch
          git rm -r .github/objective-context-patch .github/workflows/export-objective-context-worktree.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make consumer-survey context objective-aware'
          git push origin HEAD:agent/objective-aware-survey-context-20260822
