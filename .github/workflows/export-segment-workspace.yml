name: Export survey-segment workspace

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/survey-segment-resolution-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/survey-segment-resolution-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Package worktree and dependencies
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/ooh-datahub-worktree.tgz .
          tar -czf /tmp/ooh-datahub-node-modules.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: survey-segment-workspace-${{ github.run_id }}
          path: |
            /tmp/ooh-datahub-worktree.tgz
            /tmp/ooh-datahub-node-modules.tgz
          if-no-files-found: error
          retention-days: 2
