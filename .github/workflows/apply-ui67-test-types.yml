name: Apply UI67 test type fix

on:
  push:
    branches:
      - agent/ui-quality-transition-states

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-transition-states
          fetch-depth: 0
      - name: Fix deferred handles for TypeScript 6
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            "tests/component/RfqDrawer.test.tsx": [
              ('    let release: (() => void) | null = null;\n', '    let release = () => {};\n'),
              ('    release?.();\n', '    release();\n'),
            ],
            "tests/e2e/transition-quality.spec.ts": [
              ('  let release: (() => void) | null = null;\n', '  let release = () => {};\n'),
              ('  release?.();\n', '  release();\n'),
              ('  let releaseRun: (() => void) | null = null;\n', '  let releaseRun = () => {};\n'),
              ('  releaseRun?.();\n', '  releaseRun();\n'),
            ],
          }
          for filename, changes in replacements.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"missing type-fix block in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/component/RfqDrawer.test.tsx tests/e2e/transition-quality.spec.ts
          git commit -m "test: make transition deferred handles type-safe"
          git rm .github/workflows/apply-ui67-test-types.yml
          git commit -m "chore: remove UI67 test type helper"
          git push origin HEAD:agent/ui-quality-transition-states
