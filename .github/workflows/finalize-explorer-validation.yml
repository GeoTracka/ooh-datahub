name: Finalize explorer validation

on:
  push:
    branches: [agent/split-canvas-explorer]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-canvas-explorer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test
          tests/e2e/seeded-fmcg.spec.ts
          tests/e2e/sector-presets.spec.ts
          tests/e2e/network-disabled.spec.ts
      - name: Record green validation on the stacked PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head agent/split-canvas-explorer --state open --json number --jq '.[0].number')
          test -n "$pr"
          gh pr comment "$pr" --body "✅ Final stacked validation passed on $(git rev-parse --short HEAD): frozen install, pnpm verify, production build/secret scan, and core Chromium explorer E2E all green."
      - name: Remove temporary validation workflows from the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-explorer-validation.yml \
            .github/workflows/validate-stacked.yml \
            .github/workflows/cleanup-stacked-validation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: remove temporary explorer validation workflows"
          git push origin HEAD:agent/split-canvas-explorer
