name: Capture planning-context visual baseline

on:
  push:
    branches:
      - agent/consumer-survey-planning-context-ui-20260822
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: capture-planning-context-visual-baseline
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.head_ref == 'agent/consumer-survey-planning-context-ui-20260822' || github.ref_name == 'agent/consumer-survey-planning-context-ui-20260822' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consumer-survey-planning-context-ui-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate reviewed visual baselines
        run: >-
          pnpm exec playwright test
          tests/e2e/visual-accessibility.spec.ts
          --config=playwright.ui-review.config.ts
          --update-snapshots
      - name: Commit changed baseline images
        run: |
          if git diff --quiet -- tests/e2e/visual-accessibility.spec.ts-snapshots; then
            echo "Visual baselines already match the reviewed UI."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-accessibility.spec.ts-snapshots/*.png
          git commit -m "test(ui): capture planning-context visual baseline"
          git push origin HEAD:agent/consumer-survey-planning-context-ui-20260822
