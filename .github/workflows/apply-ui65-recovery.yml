name: Apply UI65 recovery patches

on:
  push:
    branches:
      - agent/ui-quality-unhappy-paths

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-unhappy-paths
          fetch-depth: 0
      - name: Apply reviewed recovery patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/app/layout.tsx",
              'import "./drawer-polish.css";\n',
              'import "./drawer-polish.css";\nimport "./recovery-polish.css";\n',
          )

          replace(
              "src/features/PlannerPage.tsx",
              'import { PackageStrip } from "@/features/PackageStrip";\n',
              'import { PackageConstraintNotice } from "@/features/PackageConstraintNotice";\nimport { PackageStrip } from "@/features/PackageStrip";\n',
          )
          replace(
              "src/features/PlannerPage.tsx",
              '''            {!visible.recommended.valid && (\n              <section role="alert" aria-label="Package constraints">\n                <strong>Package needs repair before acceptance</strong>\n                {visible.recommended.invalidReasonCodes.map((reason) => <p key={reason}>{reason}</p>)}\n              </section>\n            )}\n''',
              '''            {!visible.recommended.valid && (\n              <PackageConstraintNotice reasonCodes={visible.recommended.invalidReasonCodes} />\n            )}\n''',
          )

          replace(
              "src/features/AdjustmentsPanel.tsx",
              'import type { AdjustmentOptions, AdjustmentSiteOption } from "@/application/plannerService";\n',
              'import type { AdjustmentOptions, AdjustmentSiteOption } from "@/application/plannerService";\nimport { PackageConstraintNotice } from "@/features/PackageConstraintNotice";\n',
          )
          replace(
              "src/features/AdjustmentsPanel.tsx",
              '''      {invalidReasons.length > 0 && (\n        <section role="alert" aria-label="Fine-tune constraints">\n          <strong>Package needs repair before it can be applied</strong>\n          {invalidReasons.map((reason) => <p key={reason}>{reason}</p>)}\n        </section>\n      )}\n''',
              '''      {invalidReasons.length > 0 && (\n        <PackageConstraintNotice reasonCodes={invalidReasons} />\n      )}\n''',
          )

          replace(
              "src/features/RfqDrawer.tsx",
              'import { PlannerDrawerFrame } from "@/features/PlannerDrawerFrame";\n',
              'import { PlannerDrawerFrame } from "@/features/PlannerDrawerFrame";\nimport { RecoveryNotice } from "@/features/RecoveryNotice";\n',
          )
          replace(
              "src/features/RfqDrawer.tsx",
              '      {workflow.status === "Generation failed" && <p role="alert">{workflow.message}</p>}\n',
              '''      {workflow.status === "Generation failed" && (\n        <RecoveryNotice\n          ariaLabel="RFQ generation failure"\n          title="We couldn't generate the supplier request"\n          tone="error"\n          technicalCode={workflow.message}\n        >\n          <p>Your reviewed fields are still here. Check them and retry; nothing was sent, booked, or reserved.</p>\n        </RecoveryNotice>\n      )}\n''',
          )
          replace(
              "src/features/RfqDrawer.tsx",
              '<button className="primary" type="button" disabled={!valid || workflow.status === "Generating"} onClick={() => void generate()}>Generate RFQ</button>',
              '<button className="primary" type="button" disabled={!valid || workflow.status === "Generating"} onClick={() => void generate()}>{workflow.status === "Generation failed" ? "Retry RFQ generation" : "Generate RFQ"}</button>',
          )

          replace(
              "src/features/UploadDialog.tsx",
              'import { PlannerDrawerFrame } from "@/features/PlannerDrawerFrame";\n',
              'import { PlannerDrawerFrame } from "@/features/PlannerDrawerFrame";\nimport { RecoveryNotice } from "@/features/RecoveryNotice";\nimport { summarizeReasonCodes, uploadErrorCopy } from "@/features/recoveryCopy";\n',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''  const [quarantineCount, setQuarantineCount] = useState(0);\n  const [rejectedCount, setRejectedCount] = useState(0);\n''',
              '''  const [quarantined, setQuarantined] = useState<Array<{ reasonCodes: string[] }>>([]);\n  const [rejected, setRejected] = useState<Array<{ reasonCodes: string[] }>>([]);\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''    setQuarantineCount(validated.quarantined.length);\n    setRejectedCount(validated.rejected.length);\n''',
              '''    setQuarantined(validated.quarantined.map(({ reasonCodes }) => ({ reasonCodes })));\n    setRejected(validated.rejected.map(({ reasonCodes }) => ({ reasonCodes })));\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''      setQuarantineCount(0);\n      setRejectedCount(0);\n''',
              '''      setQuarantined([]);\n      setRejected([]);\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''  async function selectFile(file: File) {\n    setParsing(true);\n    setParseError(null);\n    try {\n''',
              '''  async function selectFile(file: File) {\n    setParsing(true);\n    setParseError(null);\n    setAccepted([]);\n    setSelected(new Set());\n    setQuarantined([]);\n    setRejected([]);\n    setSnapshot(null);\n    setPreflight(null);\n    setEnrichmentError(null);\n    try {\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''      setAccepted([]);\n      setSelected(new Set());\n      setHeaderMappings([]);\n''',
              '''      setAccepted([]);\n      setSelected(new Set());\n      setHeaderMappings([]);\n      setQuarantined([]);\n      setRejected([]);\n      setSnapshot(null);\n      setPreflight(null);\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''  const pendingMappingReview = headerMappings.some(\n    (mapping) => mapping.target && !mapping.confirmed,\n  );\n\n  return (\n''',
              '''  const pendingMappingReview = headerMappings.some(\n    (mapping) => mapping.target && !mapping.confirmed,\n  );\n  const parseRecovery = parseError ? uploadErrorCopy("parse", parseError) : null;\n  const enrichmentRecovery = enrichmentError\n    ? uploadErrorCopy("provider", enrichmentError)\n    : null;\n  const quarantineSummary = summarizeReasonCodes(quarantined);\n  const rejectionSummary = summarizeReasonCodes(rejected);\n  const validationCodes = [...new Set([\n    ...quarantineSummary.map((item) => item.code),\n    ...rejectionSummary.map((item) => item.code),\n  ])];\n\n  return (\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''        <h2>Confirm spreadsheet columns</h2>\n        <p>Some columns were recognized approximately. Confirm or correct them before the rows are used.</p>\n''',
              '''        <h2>Confirm spreadsheet columns</h2>\n        <strong>Review required before rows can be used</strong>\n        <p>Some columns were recognized approximately. Confirm or correct them before the rows are used; approximate matches are never applied automatically.</p>\n''',
          )
          replace(
              "src/features/UploadDialog.tsx",
              '''      <p className="upload-status-line">{parsing\n        ? "Reading spreadsheet locally…"\n        : accepted.length + " accepted · " + quarantineCount + " quarantined · " + rejectedCount + " rejected"}</p>\n      {parseError && <p role="alert">{parseError}</p>}\n      {enrichmentError && <p role="alert">{enrichmentError}. Uploaded facts remain usable offline.</p>}\n''',
              '''      <p className="upload-status-line">{parsing\n        ? "Reading spreadsheet locally…"\n        : accepted.length + " accepted · " + quarantined.length + " quarantined · " + rejected.length + " rejected"}</p>\n      {parseRecovery && (\n        <RecoveryNotice\n          ariaLabel="Spreadsheet read failure"\n          title={parseRecovery.title}\n          tone="error"\n          technicalCode={parseError}\n        >\n          <p>{parseRecovery.message}</p>\n        </RecoveryNotice>\n      )}\n      {enrichmentRecovery && (\n        <RecoveryNotice\n          ariaLabel="Enrichment failure"\n          title={enrichmentRecovery.title}\n          tone="warning"\n          technicalCode={enrichmentError}\n        >\n          <p>{enrichmentRecovery.message}</p>\n        </RecoveryNotice>\n      )}\n      {(quarantined.length > 0 || rejected.length > 0) && (\n        <section className="upload-validation-summary" aria-label="Upload validation summary">\n          <RecoveryNotice\n            title="Some rows were kept out of planning"\n            technicalCode={validationCodes.join(", ")}\n          >\n            <p>Only accepted rows can be selected for planning or enrichment. Quarantined and rejected rows remain excluded.</p>\n            <ul>\n              {quarantineSummary.map((item) => (\n                <li key={`q-${item.code}`}><strong>{item.count} quarantined</strong> · {item.label}</li>\n              ))}\n              {rejectionSummary.map((item) => (\n                <li key={`r-${item.code}`}><strong>{item.count} rejected</strong> · {item.label}</li>\n              ))}\n            </ul>\n          </RecoveryNotice>\n        </section>\n      )}\n''',
          )
          PY
      - name: Commit product patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/layout.tsx src/features/PlannerPage.tsx src/features/AdjustmentsPanel.tsx src/features/RfqDrawer.tsx src/features/UploadDialog.tsx
          git commit -m "ui: make degraded states human-first"
          git push origin HEAD:agent/ui-quality-unhappy-paths
      - name: Remove temporary helper
        run: |
          git rm .github/workflows/apply-ui65-recovery.yml
          git commit -m "chore: remove UI65 patch helper"
          git push origin HEAD:agent/ui-quality-unhappy-paths
