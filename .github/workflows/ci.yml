name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  data-persistence:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ooh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ooh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ooh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install data clients and raster runtime
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          postgresql-client
          gdal-bin
          python3-gdal
          python3-numpy
      - run: pnpm test:data-persistence
      - run: pnpm test:data-resolution
      - run: pnpm test:data-context
      - run: pnpm test:data-enrichment
      - run: pnpm test:data-vector-context
      - run: pnpm test:data-accessibility

  e2e-core:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test
          tests/e2e/seeded-fmcg.spec.ts
          tests/e2e/sector-presets.spec.ts
          tests/e2e/network-disabled.spec.ts

  e2e-visual:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/visual-accessibility.spec.ts
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
