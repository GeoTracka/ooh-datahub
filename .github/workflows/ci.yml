name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-survey-worktree:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/authoritative-consumer-survey-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package worktree
        run: tar --exclude=.git -czf /tmp/survey-branch-worktree.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: survey-branch-worktree-${{ github.run_id }}
          path: /tmp/survey-branch-worktree.tgz
          if-no-files-found: error
          retention-days: 2

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  data-persistence:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ooh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ooh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ooh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install data clients and geospatial runtime
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          postgresql-client
          gdal-bin
          python3-gdal
          python3-numpy
      - run: pnpm test:data-persistence
      - run: pnpm test:data-resolution
      - run: pnpm test:data-context
      - run: pnpm test:data-enrichment
      - run: pnpm test:data-vector-context
      - run: pnpm test:data-accessibility
      - run: pnpm test:data-settlement
      - run: pnpm test:data-site-context
      - run: pnpm test:data-calibration

  e2e-core:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test
          tests/e2e/seeded-fmcg.spec.ts
          tests/e2e/sector-presets.spec.ts
          tests/e2e/network-disabled.spec.ts
          tests/e2e/upload-enrichment.spec.ts
      - name: Build production app for map performance gate
        run: pnpm build
      - name: Run production map performance gate
        run: >-
          pnpm exec playwright test
          tests/e2e/map-performance.spec.ts
          --config=playwright.performance.config.ts

  e2e-visual:
    name: UI / UX review
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run visual regression and UX review suite
        run: pnpm test:ui-review
      - name: Summarize UI / UX review evidence
        if: always()
        shell: bash
        run: |
          if [ -d artifacts/ui-ux-review ]; then
            node scripts/summarize-ui-ux-review.mjs artifacts/ui-ux-review >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## UI / UX review evidence" >> "$GITHUB_STEP_SUMMARY"
            echo "- No review pack was produced; inspect the UI / UX review job failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload UI / UX review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ui-ux-review/
          if-no-files-found: warn
          retention-days: 21
      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/ui-ux/
          if-no-files-found: warn
          retention-days: 7
