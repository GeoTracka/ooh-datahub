name: Apply planning-context feature

on:
  push:
    branches:
      - agent/consumer-survey-planning-context-ui-20260822
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-planning-context-feature
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/consumer-survey-planning-context-ui-20260822' || github.ref_name == 'agent/consumer-survey-planning-context-ui-20260822' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consumer-survey-planning-context-ui-20260822
          fetch-depth: 0
      - name: Reconstruct and verify patch
        run: |
          cat .github/feature-patch/part-* > /tmp/planning-context-feature.patch
          echo '631e749659e3441bf8e5471340512cefd7834e80882216afcbf6fc2b566d9587  /tmp/planning-context-feature.patch' | sha256sum --check
          git apply --check /tmp/planning-context-feature.patch
      - name: Apply atomic feature
        run: |
          git apply --index /tmp/planning-context-feature.patch
          git rm -r .github/feature-patch .github/workflows/apply-planning-context-feature.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: surface authoritative consumer-survey planning context"
          git push origin HEAD:agent/consumer-survey-planning-context-ui-20260822
