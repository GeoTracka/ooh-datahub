name: Apply UI67 RFQ lifecycle fix

on:
  push:
    branches:
      - agent/ui-quality-transition-states

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-quality-transition-states
          fetch-depth: 0
      - name: Restore mounted guard on every effect setup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/features/RfqDrawer.tsx")
          text = p.read_text()
          old = '''  useEffect(() => () => {\n    mountedRef.current = false;\n  }, []);\n'''
          new = '''  useEffect(() => {\n    mountedRef.current = true;\n    return () => {\n      mountedRef.current = false;\n    };\n  }, []);\n'''
          if old not in text:
              raise SystemExit("missing RFQ mounted effect block")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit product fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/RfqDrawer.tsx
          git commit -m "fix: restore RFQ completion guard after Strict Mode replay"
          git rm .github/workflows/apply-ui67-rfq-mounted.yml
          git commit -m "chore: remove UI67 RFQ lifecycle helper"
          git push origin HEAD:agent/ui-quality-transition-states
