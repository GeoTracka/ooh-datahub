name: Capture segment-resolution visual baseline

on:
  push:
    branches:
      - agent/survey-audience-segment-resolution-20260822
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: capture-segment-resolution-baseline
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.head_ref == 'agent/survey-audience-segment-resolution-20260822' || github.ref_name == 'agent/survey-audience-segment-resolution-20260822' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/survey-audience-segment-resolution-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate reviewed visual baseline
        run: >-
          pnpm exec playwright test
          tests/e2e/visual-accessibility.spec.ts
          --config=playwright.ui-review.config.ts
          --update-snapshots
      - name: Verify the visual change is scoped
        run: |
          changed="$(git diff --name-only -- tests/e2e/visual-accessibility.spec.ts-snapshots)"
          expected="tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step3-focused-chromium-linux.png"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected visual baseline changes:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit reviewed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-accessibility.spec.ts-snapshots/explorer-step3-focused-chromium-linux.png
          git commit -m "test(ui): capture segment-resolution visual baseline"
          git push origin HEAD:agent/survey-audience-segment-resolution-20260822
